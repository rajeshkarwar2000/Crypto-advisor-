name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your Streamlit app link, e.g. https://xxxx.streamlit.app"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url }}
        run: gradle assembleDebug --no-daemon -PAPP_URL="$APP_URL"

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk crypto-advisor.apk
          gh release create "apk-${{ github.run_number }}" crypto-advisor.apk \
            --title "Android app ${{ github.run_number }}" \
            --notes "Download crypto-advisor.apk and install it on your phone."
